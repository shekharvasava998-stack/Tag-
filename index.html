<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Pet Digital ID • Emergency Tag</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 14px 10px; }
    
    .card {
      width: 100%;
      max-width: 410px;
      background: #ffffff;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.15);
      text-align: center;
    }

    /* Top Emergency Alert Header */
    .emergency-header {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: white;
      padding: 13px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(74, 222, 128, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
    }
    .badge-id {
      background: rgba(255, 255, 255, 0.25);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 800;
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(180deg, #ffe4e6 0%, #ffffff 100%);
      padding: 22px 16px 12px;
      position: relative;
    }
    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 12px;
    }
    .pet-photo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #f43f5e;
      box-shadow: 0 10px 22px rgba(244,63,94,0.25);
      background: #e2e8f0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .pet-photo.loaded {
      opacity: 1;
    }
    .photo-placeholder {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      border: 4px solid #f43f5e;
    }
    .species-tag {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: #0f172a;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      z-index: 2;
    }
    .pet-name { font-size: 28px; font-weight: 800; color: #0f172a; text-transform: uppercase; }
    .pet-sub { display: inline-block; margin-top: 4px; padding: 4px 12px; background: #f1f5f9; color: #475569; font-size: 13px; font-weight: 700; border-radius: 20px; }

    /* Fast Action Buttons */
    .actions { padding: 10px 18px 14px; display: flex; flex-direction: column; gap: 10px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 15px; text-decoration: none; font-size: 16px; font-weight: 800; color: white; transition: 0.1s; cursor: pointer; border: none; }
    .btn-call { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-wa { background: linear-gradient(135deg, #25d366, #16a34a); }
    .btn-gps { background: #3b82f6; font-size: 14px; padding: 11px; }
    .btn:active { transform: scale(0.97); }

    /* Information Grid */
    .info-card {
      margin: 0 18px 14px;
      background: #f8fafc;
      border-radius: 18px;
      border: 1px solid #e2e8f0;
      padding: 12px 16px;
      text-align: left;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed #e2e8f0;
      font-size: 13.5px;
    }
    .info-row:last-child { border-bottom: none; }
    .lbl { color: #64748b; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .val { color: #0f172a; font-weight: 700; }

    /* Vaccination Badge Banner */
    .vax-banner {
      margin: 0 18px 12px;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .vax-yes { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .vax-no { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

    /* Notes Box */
    .note-box {
      margin: 0 18px 16px;
      background: #fff1f2;
      border-left: 4px solid #f43f5e;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      color: #9f1239;
      text-align: left;
      line-height: 1.4;
    }

    /* GPS Status Footer */
    .gps-box {
      background: #f1f5f9;
      padding: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Top Emergency Alert -->
  <div class="emergency-header">
    <div class="live-status">
      <div class="live-dot"></div>
      EMERGENCY LOST PET ID
    </div>
    <div class="badge-id" id="dispId">TAG #101</div>
  </div>

  <!-- Pet Photo & Header -->
  <div class="hero">
    <div class="avatar-wrapper">
      <div class="photo-placeholder" id="avatarPlaceholder">🐾</div>
      <img id="petImg" class="pet-photo" src="" alt="Pet Profile Photo">
      <div class="species-tag" id="speciesIcon">🐶</div>
    </div>
    <div class="pet-name" id="petName">Loading...</div>
    <div class="pet-sub" id="petBreed">Pet Profile</div>
  </div>

  <!-- Primary Calling Buttons -->
  <div class="actions">
    <a id="btnCall" href="#" class="btn btn-call">📞 Call Parents Now</a>
    <a id="btnWa" href="#" class="btn btn-wa">💬 WhatsApp Parents</a>
    <button id="btnGpsTrigger" class="btn btn-gps" onclick="requestLiveLocation()">📍 Send Current Location to Parents</button>
  </div>

  <!-- Vaccination Badge -->
  <div id="vaxBox" class="vax-banner vax-yes">
    💉 Fully Vaccinated (રસીકરણ થયેલ છે)
  </div>

  <!-- Details Table -->
  <div class="info-card">
    <div class="info-row">
      <span class="lbl">🐾 જાતિ / Gender:</span>
      <span class="val" id="petGender">-</span>
    </div>
    <div class="info-row">
      <span class="lbl">👨‍👩‍👧 Parents / વાલી:</span>
      <span class="val" id="parentName">-</span>
    </div>
    <div class="info-row">
      <span class="lbl">📍 City / રહેઠાણ:</span>
      <span class="val" id="ownerCity">-</span>
    </div>
  </div>

  <!-- Behavioral/Medical Notes -->
  <div class="note-box" id="medicalNote">
    <b>⚠️ મહત્વપૂર્ણ નોંધ:</b> Friendly
  </div>

  <!-- Smart Location Status -->
  <div class="gps-box" id="gpsStatus">
    📍 Tap "Send Current Location" to alert parents with GPS
  </div>
</div>

<script>
  let targetPhone = "";
  let petDisplayName = "Pet";

  // 1. Tag ID Recognition (?id=101)
  const params = new URLSearchParams(window.location.search);
  const currentId = (params.get('id') || '101').trim();
  document.getElementById("dispId").innerText = "TAG #" + currentId;

  // 2. Google Sheet CSV Live Data Source
  const sheetUrl = "https://docs.google.com/spreadsheets/d/1-5xv254drMlUyuT1-gcFY503b5AXNF3D0nge50wc8A0/export?format=csv";

  fetch(sheetUrl)
    .then(res => res.text())
    .then(csv => {
      const lines = csv.split(/\r?\n/);
      let found = null;

      for (let i = 1; i < lines.length; i++) {
        const row = lines[i].split(',').map(item => item ? item.trim().replace(/^"|"$/g, '') : '');
        if (row[0] && row[0] === currentId) {
          found = {
            id: row[0],
            name: row[1] || 'Pet',
            breed: row[2] || 'Indian',
            parents: row[3] || 'Family',
            gender: row[4] || 'Male',
            vax: row[5] || 'Yes',
            phone: (row[6] || '').replace(/[^0-9]/g, ''),
            city: row[7] || 'Surat',
            note: row[8] || 'Friendly',
            photo: row[9] || ''
          };
          break;
        }
      }

      if (found) {
        petDisplayName = found.name;
        document.getElementById("petName").innerText = found.name;
        document.getElementById("parentName").innerText = found.parents;
        document.getElementById("ownerCity").innerText = found.city;
        document.getElementById("medicalNote").innerHTML = `<b>⚠️ મહત્વપૂર્ણ નોંધ:</b> ${found.note}`;

        // Gender Setting
        const gLow = found.gender.toLowerCase();
        document.getElementById("petGender").innerText = (gLow.includes("f") || gLow.includes("female") || gLow.includes("માદા")) ? "Female ♀" : "Male ♂";

        // Dog / Cat Smart Icon
        const bLow = found.breed.toLowerCase();
        if (bLow.includes("cat") || bLow.includes("બિલાડી") || bLow.includes("persian")) {
          document.getElementById("speciesIcon").innerText = "🐱";
          document.getElementById("petBreed").innerText = `${found.breed} • Cat`;
          document.getElementById("avatarPlaceholder").innerText = "🐱";
        } else {
          document.getElementById("speciesIcon").innerText = "🐶";
          document.getElementById("petBreed").innerText = `${found.breed} • Dog`;
          document.getElementById("avatarPlaceholder").innerText = "🐶";
        }

        // Vaccination Status
        const vLow = found.vax.toLowerCase();
        const vBox = document.getElementById("vaxBox");
        if (vLow.includes("no") || vLow.includes("નથી")) {
          vBox.className = "vax-banner vax-no";
          vBox.innerHTML = "⚠️ Vaccination Pending / રસીકરણ બાકી છે";
        } else {
          vBox.className = "vax-banner vax-yes";
          vBox.innerHTML = "💉 Fully Vaccinated (રસીકરણ થયેલ છે)";
        }

        // Action Buttons Setup
        targetPhone = found.phone;
        if (targetPhone.length === 10) targetPhone = "91" + targetPhone;
        document.getElementById("btnCall").href = "tel:" + targetPhone;
        document.getElementById("btnWa").href = `https://wa.me/${targetPhone}?text=Hello, mane tamaro pet ${found.name} malyo chhe.`;

        // Direct Photo Logic (No sample photo flicker!)
        let pUrl = found.photo.trim();
        if (pUrl) {
          if (pUrl.includes("ibb.co/") && !pUrl.includes("i.ibb.co/")) {
            const id = pUrl.split("ibb.co/")[1]?.split("/")[0];
            if (id) pUrl = `https://i.ibb.co/${id}/image.jpg`;
          } else if (pUrl.includes("drive.google.com")) {
            const dId = pUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || pUrl.match(/id=([a-zA-Z0-9_-]+)/);
            if (dId && dId[1]) pUrl = `https://lh3.googleusercontent.com/d/${dId[1]}`;
          }

          if (pUrl.startsWith("http")) {
            const img = document.getElementById("petImg");
            img.src = pUrl;
            img.onload = () => {
              img.classList.add("loaded");
              document.getElementById("avatarPlaceholder").style.display = "none";
            };
          }
        }
      }
    })
    .catch(e => console.log(e));

  // Geolocation Handler - User click kare tyare browser tarat popup aapse!
  function requestLiveLocation() {
    const s = document.getElementById("gpsStatus");
    if (!("geolocation" in navigator)) {
      alert("Tamara browser ma GPS support nathi.");
      return;
    }

    s.innerText = "⏳ Requesting GPS permission...";
    
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
        
        s.innerText = "✅ Location Maligayi! WhatsApp open thay chhe...";
        s.style.color = "#15803d";
        s.style.background = "#dcfce7";

        // Direct WhatsApp with Google Maps Link
        if (targetPhone) {
          const msg = encodeURIComponent(`🚨 EMERGENCY: Mane tamaro pet ${petDisplayName} malyo chhe!\n📍 Mari live location aa chhe: ${mapsLink}`);
          window.location.href = `https://wa.me/${targetPhone}?text=${msg}`;
        }
      },
      (err) => {
        s.innerText = "⚠️ Location permission block chhe. Browser settings mathi Allow karo.";
        s.style.color = "#b91c1c";
        s.style.background = "#fee2e2";
        alert("Krupa kari location permission Allow (मંજૂરી) aapo.");
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // Auto trigger attempt
  window.addEventListener("DOMContentLoaded", () => {
    if ("geolocation" in navigator && navigator.permissions) {
      navigator.permissions.query({ name: 'geolocation' }).then(res => {
        if (res.state === 'granted') {
          requestLiveLocation();
        }
      }).catch(e => {});
    }
  });
</script>

</body>
</html>
